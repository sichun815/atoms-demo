<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Atoms Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1a1a1a;
      --code: #0d0d0d;
      --border: #262626;
      --border-2: #2a2a2a;
      --text: #ededed;
      --muted: #a1a1a1;
      --faint: #6b6b6b;
      --placeholder: #525252;
      --blue: #3b82f6;
      --blue-hover: #60a5fa;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #eab308;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, textarea { font: inherit; }
    button { cursor: pointer; border-radius: 6px; transition: background-color 150ms, border-color 150ms, color 150ms, opacity 150ms; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    textarea::placeholder { color: var(--placeholder); }
    button:focus-visible, textarea:focus-visible { outline: 2px solid rgba(59, 130, 246, .9); outline-offset: 2px; }
    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(59, 130, 246, .2); }
    ::selection { background: rgba(59, 130, 246, .35); color: #fff; }
    .app-shell { height: 100vh; min-height: 540px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
    .workspace { height: calc(100vh - 56px); min-height: 0; display: flex; background: var(--bg); }
    .prompt-pane { width: 320px; flex: 0 0 320px; min-width: 0; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
    .preview-pane { min-width: 0; flex: 1 1 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg); }
    .code-pane { width: 360px; flex: 0 0 360px; min-width: 0; background: var(--panel); display: flex; flex-direction: column; }
    .pane-head { height: 56px; flex: 0 0 56px; border-bottom: 1px solid var(--border); background: rgba(20, 20, 20, .96); }
    .preview-surface {
      min-height: 0;
      flex: 1;
      padding: 14px;
      display: flex;
      overflow: auto;
      background:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.08) 1px, transparent 0) 0 0 / 18px 18px,
        radial-gradient(circle at 50% 0%, rgba(59,130,246,.10), transparent 38%),
        var(--bg);
    }
    .preview-frame { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 6px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .code-scroll { min-height: 0; flex: 1; overflow: auto; }
    .code-scroll pre { width: max-content; min-width: 100%; tab-size: 2; }
    .thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 8px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .spinner { width: 22px; height: 22px; border: 1.5px solid #2a2a2a; border-top-color: var(--blue); border-radius: 50%; animation: spin .85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title-chip { letter-spacing: .05em; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid transparent; padding: 2px 8px; font-size: 11px; line-height: 16px; }
    .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 16%, transparent); }
    .status-success { color: var(--success); background: rgba(34, 197, 94, .08); border-color: rgba(34, 197, 94, .22); }
    .status-pending { color: var(--warning); background: rgba(234, 179, 8, .08); border-color: rgba(234, 179, 8, .22); }
    .status-failed { color: var(--danger); background: rgba(239, 68, 68, .08); border-color: rgba(239, 68, 68, .22); }
    .icon-button { position: relative; color: var(--muted); background: transparent; }
    .icon-button:hover { color: var(--text); background: var(--border); }
    .icon-button:hover::after {
      content: attr(aria-label);
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #111;
      padding: 5px 7px;
      font-size: 11px;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .icon-button:disabled:hover::after { display: none; }
    .code-font { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    @media (max-width: 1180px) {
      .prompt-pane { width: 300px; flex-basis: 300px; }
      .code-pane { width: 340px; flex-basis: 340px; }
      .preview-surface { padding: 12px; }
    }
    @media (max-width: 880px) {
      .app-shell { min-height: 100vh; height: auto; }
      .workspace { display: block; }
      .prompt-pane, .code-pane { width: 100%; border-left: 0; border-right: 0; }
      .prompt-pane { border-bottom: 1px solid var(--border); }
      .preview-pane { height: min(75vh, 680px); min-height: 420px; }
      .code-pane { height: 360px; border-top: 1px solid var(--border); }
      .preview-surface { padding: 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const API_BASE = (location.hostname === "localhost" || location.protocol === "file:")
      ? "http://localhost:3002"
      : window.location.origin;
    const MODEL_NAME = "kimi-k2.6";
    const { useState, useEffect, useRef } = React;

    async function api(path, options = {}) {
      let response;
      try {
        response = await fetch(`${API_BASE}${path}`, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
      } catch {
        throw new Error("网络错误，请确认后端服务运行在 3002 端口");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }

    function relativeTime(value) {
      if (!value) return "";
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
      if (!Number.isFinite(seconds)) return "";
      if (seconds < 60) return "刚刚";
      if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
      if (seconds < 604800) return `${Math.floor(seconds / 86400)} 天前`;
      return new Date(value).toLocaleDateString("zh-CN");
    }

    function fullTime(value) {
      return value ? new Date(value).toLocaleString("zh-CN") : "—";
    }

    function StatusBadge({ status }) {
      const styles = {
        success: "status-success",
        pending: "status-pending",
        failed: "status-failed",
      };
      const labels = { success: "完成", pending: "生成中", failed: "失败" };
      return <span className={`status-badge shrink-0 ${styles[status] || styles.pending}`}>{labels[status] || status}</span>;
    }

    function PromptPanel({ draft, setDraft, onGenerate, isGenerating, history, onSelect, currentId, historyError }) {
      return (
        <aside className="prompt-pane flex w-[320px] flex-shrink-0 flex-col border-r border-[#262626]">
          <div className="pane-head flex items-center px-5">
            <h2 className="text-sm font-semibold text-[#ededed]">创建应用</h2>
          </div>
          <form className="border-b border-[#262626] p-5" onSubmit={(event) => { event.preventDefault(); onGenerate(draft); }}>
            <label htmlFor="prompt" className="mb-3 block text-xs font-medium text-[#a1a1a1]">需求描述</label>
            <textarea
              id="prompt"
              value={draft}
              onChange={(event) => setDraft(event.target.value)}
              placeholder="描述你想要的应用，例如：做一个扫雷游戏，支持难度选择和重新开始"
              className="h-[140px] w-full resize-none rounded-md border border-[#2a2a2a] bg-[#1a1a1a] p-3 text-sm leading-6 text-[#ededed] placeholder:text-[#525252] focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
              maxLength={2000}
              disabled={isGenerating}
            />
            <button type="submit" disabled={isGenerating || !draft.trim()} className="mt-3 flex h-10 w-full items-center justify-center gap-2 rounded-md bg-[#3b82f6] px-4 text-sm font-semibold text-white transition-colors duration-150 hover:bg-[#60a5fa] disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-[#3b82f6]">
              {isGenerating && <span className="spinner !h-4 !w-4 !border-white/35 !border-t-white" />}
              {isGenerating ? "生成中..." : "生成"}
            </button>
          </form>
          <div className="flex min-h-0 flex-1 flex-col">
            <div className="flex items-center justify-between px-5 pb-3 pt-5">
              <h2 className="title-chip text-xs font-semibold uppercase text-[#6b6b6b]">最近生成</h2>
              <span className="text-xs text-[#6b6b6b]">{Math.min(history.length, 5)} / 5</span>
            </div>
            <div className="thin-scroll min-h-0 flex-1 overflow-y-auto px-3 pb-4">
              {historyError && <p className="px-2 py-3 text-xs text-[#ef4444]">{historyError}</p>}
              {!historyError && history.length === 0 && <p className="px-2 py-3 text-sm text-[#a1a1a1]">暂无记录</p>}
              {history.slice(0, 5).map((item) => (
                <button key={item.id} type="button" onClick={() => onSelect(item.id)}
                  className={`mb-1 w-full rounded-md border px-3 py-3 text-left transition-colors duration-150 hover:bg-[#1a1a1a] ${currentId === item.id ? "border-blue-500/60 bg-blue-500/10" : "border-transparent"}`}>
                  <span className="block truncate text-sm text-[#ededed]">{item.prompt.slice(0, 40)}</span>
                  <span className="mt-2 flex items-center justify-between gap-2 text-xs text-[#a1a1a1]">
                    <span>{relativeTime(item.created_at)}</span>
                    <StatusBadge status={item.status} />
                  </span>
                </button>
              ))}
            </div>
          </div>
        </aside>
      );
    }

    function IconButton({ title, disabled, onClick, children }) {
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          title={title}
          aria-label={title}
          className="icon-button inline-flex h-8 w-8 items-center justify-center rounded-md transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent disabled:hover:text-[#a1a1a1]"
        >
          {children}
        </button>
      );
    }

    function PreviewPanel({ generation, isGenerating, onModify, onRetry, displayError }) {
      const [reloadKey, setReloadKey] = useState(0);
      const surfaceRef = useRef(null);
      const ready = generation?.status === "success" && generation.html;
      const pending = isGenerating || generation?.status === "pending";
      const title = generation?.prompt?.trim().slice(0, 20) || "生成的应用";

      return (
        <section className="preview-pane flex flex-1 min-w-0 flex-col border-r border-[#262626]" aria-label="应用预览">
          <div className="pane-head flex items-center justify-between gap-3 px-4">
            <div className="min-w-0">
              <p className="text-[11px] font-medium text-[#6b6b6b]">预览</p>
              <h2 className="truncate text-sm font-semibold text-[#ededed]" title={generation?.prompt || title}>{title}</h2>
            </div>
            <div className="flex shrink-0 items-center gap-1">
              <IconButton title="修改需求" onClick={onModify} disabled={!ready}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
              </IconButton>
              <IconButton title="重新加载" onClick={() => setReloadKey((value) => value + 1)} disabled={!ready}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.6 6.1" /><path d="M3 12A9 9 0 0 1 18.6 5.9" /><path d="M3 4v6h6" /><path d="M21 20v-6h-6" /></svg>
              </IconButton>
              <IconButton title="全屏" onClick={() => surfaceRef.current?.requestFullscreen?.()} disabled={!ready}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
              </IconButton>
            </div>
          </div>
          <div className="preview-surface" ref={surfaceRef}>
            {ready && !pending ? (
              <iframe key={`${generation.id}-${reloadKey}`} title="生成的应用" sandbox="allow-scripts allow-forms allow-modals" srcDoc={generation.html} className="preview-frame w-full h-full bg-white" />
            ) : (
              <div className="flex min-h-full w-full items-center justify-center rounded-md border border-[#262626] bg-[#0a0a0a]/80 p-6 text-center shadow-[inset_0_1px_0_rgba(255,255,255,.03)]">
                {pending ? (
                  <div className="flex flex-col items-center gap-4"><span className="spinner" /><p className="text-sm text-[#ededed]">AI 正在生成...</p></div>
                ) : displayError || generation?.status === "failed" ? (
                  <div className="max-w-md">
                    <h3 className="text-sm font-semibold text-[#ef4444]">生成失败</h3>
                    <p className="mt-2 break-words text-sm leading-6 text-[#a1a1a1]">{displayError || generation.error || "未知错误"}</p>
                    {generation?.id && <button type="button" onClick={onRetry} className="mt-5 rounded-md border border-[#262626] px-4 py-2 text-sm text-[#ededed] transition-colors duration-150 hover:bg-[#1a1a1a]">重试</button>}
                  </div>
                ) : (
                  <div className="max-w-sm text-[#a1a1a1]">
                    <div className="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-md border border-[#262626] bg-[#141414]" aria-hidden="true">
                      <svg viewBox="0 0 24 24" className="h-6 w-6 text-[#a1a1a1]" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="m14 4 6 6" />
                        <path d="m5 19 9.5-9.5" />
                        <path d="m12.5 5.5 6 6" />
                        <path d="M5 5v4" />
                        <path d="M3 7h4" />
                        <path d="M19 15v3" />
                        <path d="M17.5 16.5h3" />
                      </svg>
                    </div>
                    <p className="text-base font-medium text-[#ededed]">在左侧输入你的需求，点击生成</p>
                    <p className="mt-2 text-[13px] leading-5 text-[#a1a1a1]">生成的网页应用会在这里实时预览</p>
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="flex min-h-9 flex-wrap items-center gap-x-4 gap-y-1 border-t border-[#262626] px-4 py-2 text-[11px] text-[#a1a1a1]">
            <span>创建于 {fullTime(generation?.created_at)}</span>
            <span>模型 {generation?.model || MODEL_NAME}</span>
            {generation?.usage && <span>Token {generation.usage.total_tokens ?? ((generation.usage.input_tokens || 0) + (generation.usage.output_tokens || 0))}</span>}
            {generation && <StatusBadge status={pending ? "pending" : generation.status} />}
          </div>
        </section>
      );
    }

    function CodePanel({ generation }) {
      const [copied, setCopied] = useState(false);
      useEffect(() => setCopied(false), [generation?.id, generation?.html]);
      async function copyCode() {
        try {
          await navigator.clipboard.writeText(generation.html);
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch {
          setCopied(false);
        }
      }
      return (
        <aside className="code-pane flex w-[360px] flex-shrink-0 flex-col" aria-label="生成代码">
          <div className="pane-head flex items-center justify-between px-4">
            <div>
              <h2 className="text-sm font-semibold text-[#ededed]">代码</h2>
              <p className="code-font text-[11px] text-[#a1a1a1]">index.html</p>
            </div>
            <button type="button" onClick={copyCode} disabled={!generation?.html} className="inline-flex items-center gap-2 rounded-md border border-[#262626] px-3 py-1.5 text-xs text-[#a1a1a1] transition-colors duration-150 hover:bg-[#1a1a1a] hover:text-[#ededed] disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent">
              <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg>
              {copied ? "已复制" : "复制"}
            </button>
          </div>
          <div className="code-scroll thin-scroll bg-[#0d0d0d]">
            {generation?.html ? <pre className="code-font p-4 text-xs leading-5 text-[#a1a1a1]"><code>{generation.html}</code></pre> : <div className="flex h-full min-h-[220px] items-center justify-center p-6 text-center text-sm text-[#a1a1a1]">生成的 HTML 代码会显示在这里</div>}
          </div>
          <div className="border-t border-[#262626] px-4 py-2 text-[11px] text-[#a1a1a1]">{generation?.html ? `${generation.html.length.toLocaleString()} 字符` : "HTML"}</div>
        </aside>
      );
    }

    function History({ history, onSelect, error, onRefresh }) {
      return (
        <main className="thin-scroll min-h-0 flex-1 overflow-y-auto bg-[#0a0a0a]">
          <div className="mx-auto max-w-5xl px-6 py-8">
            <div className="mb-6 flex items-center justify-between gap-3">
              <div><h1 className="text-xl font-semibold text-[#ededed]">历史记录</h1><p className="mt-1 text-xs text-[#a1a1a1]">{history.length} 条记录</p></div>
              <button type="button" onClick={onRefresh} className="rounded-md border border-[#262626] px-3 py-2 text-xs text-[#a1a1a1] transition-colors duration-150 hover:bg-[#1a1a1a] hover:text-[#ededed]">刷新</button>
            </div>
            {error && <p className="mb-4 text-sm text-[#ef4444]">{error}</p>}
            {!error && history.length === 0 && <p className="border-t border-[#262626] py-8 text-sm text-[#a1a1a1]">暂无生成记录</p>}
            <div className="overflow-hidden rounded-md border border-[#262626] bg-[#141414]">
              {history.map((item) => (
                <button key={item.id} type="button" onClick={() => onSelect(item.id)} className="flex w-full flex-wrap items-start justify-between gap-4 border-b border-[#262626] px-4 py-5 text-left transition-colors duration-150 last:border-b-0 hover:bg-[#1a1a1a]">
                  <span className="min-w-0 flex-1 whitespace-pre-wrap break-words text-sm leading-6 text-[#ededed]">{item.prompt}</span>
                  <span className="flex shrink-0 items-center gap-4"><time className="text-xs text-[#a1a1a1]">{fullTime(item.created_at)}</time><StatusBadge status={item.status} /></span>
                </button>
              ))}
            </div>
          </div>
        </main>
      );
    }

    function ModifyDialog({ onClose, onSubmit, isGenerating }) {
      const [text, setText] = useState("");
      useEffect(() => {
        const onKeyDown = (event) => { if (event.key === "Escape" && !isGenerating) onClose(); };
        document.addEventListener("keydown", onKeyDown);
        return () => document.removeEventListener("keydown", onKeyDown);
      }, [onClose, isGenerating]);
      return (
        <div className="fixed inset-0 z-30 flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm" onMouseDown={(event) => { if (event.target === event.currentTarget && !isGenerating) onClose(); }}>
          <form role="dialog" aria-modal="true" aria-labelledby="modify-title" onSubmit={(event) => { event.preventDefault(); if (text.trim()) onSubmit(text.trim()); }} className="w-full max-w-lg rounded-md border border-[#262626] bg-[#141414] p-5 shadow-2xl">
            <div className="flex items-center justify-between gap-3">
              <h2 id="modify-title" className="text-base font-semibold text-[#ededed]">修改需求</h2>
              <button type="button" onClick={onClose} disabled={isGenerating} aria-label="关闭" className="inline-flex h-8 w-8 items-center justify-center rounded-md text-[#a1a1a1] transition-colors duration-150 hover:bg-[#262626] hover:text-[#ededed]">
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
              </button>
            </div>
            <textarea autoFocus value={text} onChange={(event) => setText(event.target.value)} maxLength={2000} placeholder="例如：把扫雷的格子调大一点" className="mt-4 h-[140px] w-full resize-none rounded-md border border-[#2a2a2a] bg-[#1a1a1a] p-3 text-sm leading-6 text-[#ededed] placeholder:text-[#525252] focus:border-blue-500 focus:ring-2 focus:ring-blue-500" />
            <div className="mt-4 flex justify-end gap-2">
              <button type="button" onClick={onClose} disabled={isGenerating} className="rounded-md px-4 py-2 text-sm text-[#a1a1a1] transition-colors duration-150 hover:bg-[#262626] hover:text-[#ededed]">取消</button>
              <button type="submit" disabled={!text.trim() || isGenerating} className="rounded-md bg-[#3b82f6] px-4 py-2 text-sm font-medium text-white transition-colors duration-150 hover:bg-[#60a5fa] disabled:cursor-not-allowed disabled:opacity-50">生成新版本</button>
            </div>
          </form>
        </div>
      );
    }

    function App() {
      const [currentView, setCurrentView] = useState("workspace");
      const [currentGeneration, setCurrentGeneration] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [history, setHistory] = useState([]);
      const [historyError, setHistoryError] = useState("");
      const [displayError, setDisplayError] = useState("");
      const [draft, setDraft] = useState("");
      const [modifyOpen, setModifyOpen] = useState(false);
      const operationRef = useRef(0);

      async function refreshHistory() {
        try {
          const records = await api("/api/generations");
          setHistory(records);
          setHistoryError("");
        } catch (error) {
          setHistoryError(error.message);
        }
      }

      useEffect(() => { refreshHistory(); }, []);
      useEffect(() => { if (currentView === "history") refreshHistory(); }, [currentView]);
      useEffect(() => () => { operationRef.current += 1; }, []);

      async function pollGeneration(id, operation) {
        for (let attempt = 0; attempt < 30; attempt += 1) {
          if (operationRef.current !== operation) return;
          try {
            const record = await api(`/api/generations/${encodeURIComponent(id)}`);
            if (operationRef.current !== operation) return;
            setCurrentGeneration(record);
            if (record.status !== "pending") {
              setIsGenerating(false);
              refreshHistory();
              return;
            }
          } catch (error) {
            if (operationRef.current !== operation) return;
            setDisplayError(error.message);
            setIsGenerating(false);
            return;
          }
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        if (operationRef.current === operation) {
          setDisplayError("生成超时");
          setIsGenerating(false);
          refreshHistory();
        }
      }

      async function submitGeneration(prompt, parentId = null) {
        if (!prompt?.trim() || isGenerating) return;
        const operation = ++operationRef.current;
        setIsGenerating(true);
        setDisplayError("");
        setCurrentView("workspace");
        setModifyOpen(false);
        try {
          const data = await api("/api/generations", {
            method: "POST",
            body: JSON.stringify({ prompt: prompt.trim(), ...(parentId ? { parentId } : {}) }),
          });
          if (operationRef.current !== operation) return;
          setCurrentGeneration({ id: data.id, prompt: prompt.trim(), html: null, status: "pending", error: null, created_at: new Date().toISOString(), parent_id: parentId });
          refreshHistory();
          pollGeneration(data.id, operation);
        } catch (error) {
          if (operationRef.current !== operation) return;
          setDisplayError(error.message);
          setIsGenerating(false);
        }
      }

      async function selectGeneration(id) {
        const operation = ++operationRef.current;
        setCurrentView("workspace");
        setDisplayError("");
        setIsGenerating(false);
        try {
          const record = await api(`/api/generations/${encodeURIComponent(id)}`);
          if (operationRef.current !== operation) return;
          setCurrentGeneration(record);
          if (record.status === "pending") {
            setIsGenerating(true);
            pollGeneration(id, operation);
          }
        } catch (error) {
          if (operationRef.current === operation) {
            setCurrentGeneration(null);
            setDisplayError(error.message);
          }
        }
      }

      async function retryGeneration() {
        if (!currentGeneration?.id || isGenerating) return;
        const id = currentGeneration.id;
        const operation = ++operationRef.current;
        setDisplayError("");
        setIsGenerating(true);
        try {
          await api(`/api/generations/${encodeURIComponent(id)}/retry`, { method: "POST" });
          if (operationRef.current !== operation) return;
          setCurrentGeneration((record) => ({ ...record, html: null, status: "pending", error: null }));
          refreshHistory();
          pollGeneration(id, operation);
        } catch (error) {
          if (operationRef.current !== operation) return;
          setDisplayError(error.message);
          setIsGenerating(false);
        }
      }

      return (
        <div className="app-shell">
          <header className="flex h-14 shrink-0 items-center justify-between border-b border-[#262626] bg-[#0a0a0a] px-4 sm:px-6">
            <div className="flex items-center gap-3">
              <svg viewBox="0 0 32 32" className="h-8 w-8 shrink-0" aria-hidden="true">
                <rect x="1" y="1" width="30" height="30" rx="7" fill="#141414" stroke="#262626" />
                <path d="M10.2 22 15 10h2l4.8 12h-2.1l-1.1-3h-5.2l-1.1 3h-2.1Zm4-4.8h3.7L16 12.2l-1.8 5Z" fill="#ededed" />
              </svg>
              <div>
                <div className="text-sm font-semibold leading-4 text-[#ededed]">Atoms Lite</div>
                <div className="text-[11px] leading-4 text-[#a1a1a1]">用自然语言生成可运行的应用</div>
              </div>
            </div>
            <nav className="flex items-center gap-1 rounded-full border border-[#262626] bg-[#141414] p-1" aria-label="主导航">
              <button type="button" onClick={() => setCurrentView("workspace")} className={`rounded-full px-3 py-1.5 text-sm transition-colors duration-150 ${currentView === "workspace" ? "bg-[#262626] text-[#ededed]" : "text-[#a1a1a1] hover:bg-[#1a1a1a] hover:text-[#ededed]"}`}>Workspace</button>
              <button type="button" onClick={() => setCurrentView("history")} className={`rounded-full px-3 py-1.5 text-sm transition-colors duration-150 ${currentView === "history" ? "bg-[#262626] text-[#ededed]" : "text-[#a1a1a1] hover:bg-[#1a1a1a] hover:text-[#ededed]"}`}>History</button>
            </nav>
          </header>
          {currentView === "workspace" ? (
            <main className="workspace flex h-[calc(100vh-56px)] bg-[#0a0a0a] text-[#ededed]">
              <PromptPanel draft={draft} setDraft={setDraft} onGenerate={submitGeneration} isGenerating={isGenerating} history={history} onSelect={selectGeneration} currentId={currentGeneration?.id} historyError={historyError} />
              <PreviewPanel generation={currentGeneration} isGenerating={isGenerating} onModify={() => setModifyOpen(true)} onRetry={retryGeneration} displayError={displayError} />
              <CodePanel generation={currentGeneration} />
            </main>
          ) : <History history={history} onSelect={selectGeneration} error={historyError} onRefresh={refreshHistory} />}
          {modifyOpen && <ModifyDialog onClose={() => setModifyOpen(false)} onSubmit={(text) => submitGeneration(text, currentGeneration.id)} isGenerating={isGenerating} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
