<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Atoms Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1a1a1a;
      --code: #0d0d0d;
      --border: #262626;
      --border-2: #2a2a2a;
      --text: #ededed;
      --muted: #a1a1a1;
      --faint: #6b6b6b;
      --placeholder: #525252;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --danger: #ef4444;
      --success: #22c55e;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, textarea { font: inherit; }
    button { cursor: pointer; border-radius: 6px; transition: background-color 150ms, border-color 150ms, color 150ms, opacity 150ms; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    textarea::placeholder { color: var(--placeholder); }
    button:focus-visible, textarea:focus-visible { outline: 2px solid rgba(139, 92, 246, .9); outline-offset: 2px; }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139, 92, 246, .2); }
    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }
    ::selection { background: rgba(139, 92, 246, .35); color: #fff; }
    .app-shell > header { position: relative; }
    .app-shell > header::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(139, 92, 246, .3), transparent); pointer-events: none; }
    .app-shell > header svg[viewBox="0 0 32 32"] { border-radius: 7px; background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%); }
    .app-shell {
      height: 100vh; min-height: 540px; display: flex; flex-direction: column; color: var(--text);
      background:
        radial-gradient(ellipse 70% 46% at 50% -6%, rgba(124, 92, 250, .14), transparent 62%),
        radial-gradient(ellipse 50% 40% at 6% 108%, rgba(124, 92, 250, .07), transparent 70%),
        radial-gradient(ellipse 50% 40% at 94% 108%, rgba(124, 92, 250, .07), transparent 70%),
        var(--bg);
    }
    .workspace { width: 100%; height: calc(100vh - 56px); min-height: 0; display: flex; background: transparent; }
    .prompt-pane { width: 320px; flex: 0 0 320px; min-width: 0; border-right: 1px solid rgba(139, 92, 246, .16); background: linear-gradient(180deg, rgba(23, 20, 34, .55), rgba(16, 15, 22, .78)); display: flex; flex-direction: column; }
    .preview-pane { width: 0; min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; border-right: 1px solid rgba(139, 92, 246, .16); background: transparent; }
    .code-pane { width: 360px; flex: 0 0 360px; min-width: 0; background: linear-gradient(180deg, rgba(23, 20, 34, .55), rgba(16, 15, 22, .78)); display: flex; flex-direction: column; }
    .pane-head { height: 56px; flex: 0 0 56px; border-bottom: 1px solid rgba(139, 92, 246, .14); background: rgba(18, 16, 28, .55); }
    .preview-surface {
      min-height: 0;
      flex: 1;
      padding: 14px;
      display: flex;
      overflow: auto;
      background:
        radial-gradient(circle at 1px 1px, rgba(167, 139, 250, .14) 1px, transparent 0) 0 0 / 18px 18px,
        radial-gradient(circle at 50% 0%, rgba(139, 92, 246, .14), transparent 40%),
        transparent;
    }
    .preview-frame { width: 100%; height: 100%; border: 1px solid rgba(139, 92, 246, .22); border-radius: 14px; background: #fff; box-shadow: 0 20px 60px rgba(0, 0, 0, .4), 0 0 40px rgba(124, 92, 250, .1); }
    .code-scroll { min-height: 0; flex: 1; overflow: auto; }
    .code-scroll pre { width: max-content; min-width: 100%; tab-size: 2; }
    .thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 8px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .spinner { width: 22px; height: 22px; border: 1.5px solid #2a2a2a; border-top-color: var(--accent); border-radius: 50%; animation: spin .85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title-chip { letter-spacing: .05em; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid transparent; padding: 2px 8px; font-size: 11px; line-height: 16px; }
    .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 16%, transparent); }
    .status-success { color: var(--success); background: rgba(34, 197, 94, .08); border-color: rgba(34, 197, 94, .22); }
    .status-pending { color: var(--accent); background: rgba(139, 92, 246, .12); border-color: rgba(139, 92, 246, .25); }
    .status-failed { color: var(--danger); background: rgba(239, 68, 68, .08); border-color: rgba(239, 68, 68, .22); }
    .icon-button { position: relative; color: var(--muted); background: transparent; }
    .icon-button:hover { color: var(--text); background: var(--border); }
    .icon-button:hover::after {
      content: attr(aria-label);
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #111;
      padding: 5px 7px;
      font-size: 11px;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .icon-button:disabled:hover::after { display: none; }
    .code-font { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    /* ---- Landing (light, official-site style) ---- */
    .landing {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 104px 24px 72px;
      background: #fff;
      color: #111;
      overflow-x: hidden;
    }
    .lt-nav { position: absolute; top: 18px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; z-index: 6; }
    .lt-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #111; }
    .lt-menu { display: flex; align-items: center; gap: 2px; border: 1px solid #ececea; border-radius: 999px; background: #f6f6f5; padding: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .lt-menu button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #555; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background-color 150ms, color 150ms; }
    .lt-menu button:hover { background: #ececea; color: #111; }
    .lt-new { font-size: 10px; line-height: 1; color: #0f9d58; background: rgba(15,157,88,.12); border-radius: 6px; padding: 3px 5px; font-weight: 600; }
    .lt-login { border: 1px solid #e5e5e3; background: #fff; border-radius: 999px; padding: 8px 18px; font-size: 13px; font-weight: 600; color: #111; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.05); transition: background-color 150ms; }
    .lt-login:hover { background: #f6f6f5; }
    .lt-trust { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #555; }
    .lt-trust strong { font-weight: 700; color: #111; display: inline-flex; align-items: center; gap: 7px; font-size: 15px; }
    .float-card { position: absolute; width: 200px; border-radius: 14px; border: 1px solid #ececea; background: #fff; box-shadow: 0 18px 44px rgba(0,0,0,.13); padding: 8px 8px 10px; z-index: 1; }
    .float-card .shot { height: 112px; border-radius: 9px; }
    .float-card .tag { margin-top: 8px; font-size: 12px; color: #333; text-align: center; }
    @media (max-width: 900px) { .float-card { display: none; } }
    .hero-title { margin: 18px 0 0; font-size: clamp(38px, 6vw, 60px); line-height: 1.14; font-weight: 800; letter-spacing: .01em; color: #111; text-align: center; }
    .hero-title .grad {
      background: linear-gradient(92deg, #a78bfa 0%, #7c5cfa 55%, #6d4ef0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-sub { margin: 22px 0 0; max-width: 560px; text-align: center; font-size: 14px; line-height: 1.9; color: var(--muted); }
    .hero-card {
      width: 100%;
      max-width: 600px;
      margin-top: 38px;
      border: 1px solid #e7e7e5;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
      padding: 18px 20px 14px;
      position: relative;
      z-index: 2;
    }
    .hero-card:focus-within { border-color: #cfcfcd; box-shadow: 0 16px 48px rgba(0,0,0,.12); }
    .hero-card-label { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; color: #a78bfa; }
    .hero-textarea {
      width: 100%;
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      outline: none !important;
      resize: none;
      min-height: 88px;
      font-size: 15px;
      line-height: 1.7;
      color: #111;
    }
    .hero-textarea::placeholder { color: #9a9a97; }
    .hero-foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    .hero-hint { font-size: 12px; color: #b6b6b3; }
    .hero-start {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 999px;
      background: #2f6bff;
      color: #fff;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms, transform 150ms;
    }
    .hero-start:hover:not(:disabled) { background: #2456d6; transform: translateY(-1px); }
    .hero-start:disabled { opacity: .5; cursor: not-allowed; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(139, 92, 246, .45);
      border-radius: 999px;
      background: rgba(139, 92, 246, .08);
      padding: 5px 14px;
      font-size: 12px;
      color: #c4b5fd;
    }
    .hero-badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: #a78bfa; box-shadow: 0 0 8px rgba(167, 139, 250, .9); }
    .hero-send {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 0;
      background: #7c5cfa;
      color: #fff;
      transition: background-color 150ms, transform 150ms;
    }
    .hero-send:hover:not(:disabled) { background: #6d4ef0; transform: translateY(-1px); }
    .made-by {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(28, 28, 30, .92);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }
    .hero-chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(20, 20, 20, .7);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      transition: border-color 150ms, color 150ms, background-color 150ms;
      white-space: nowrap;
    }
    .hero-chip:hover { border-color: rgba(139, 92, 246, .55); background: rgba(139, 92, 246, .08); color: var(--text); }
    .btn-primary-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      background: #7c5cfa;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      transition: background-color 150ms;
    }
    .btn-primary-pill:hover { background: #6d4ef0; }
    /* ---- Workspace（与落地页统一的设计语言） ---- */
    .ws-label { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; color: #a78bfa; }
    .ws-textarea {
      width: 100%;
      border: 1px solid rgba(139, 92, 246, .22);
      border-radius: 12px;
      background: rgba(20, 18, 30, .6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .02);
      resize: none;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--text);
      transition: border-color 150ms, box-shadow 150ms;
    }
    .ws-textarea::placeholder { color: var(--placeholder); }
    .ws-textarea:focus { border-color: rgba(139, 92, 246, .6); box-shadow: 0 0 0 2px rgba(139, 92, 246, .16), 0 0 30px rgba(124, 92, 250, .12); }
    .generate-btn {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(92deg, #8b5cf6 0%, #7c5cfa 100%);
      box-shadow: 0 8px 26px rgba(124, 92, 250, .3);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      transition: filter 150ms, transform 150ms, box-shadow 150ms;
    }
    .generate-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 10px 32px rgba(124, 92, 250, .42); }
    .ws-item { border: 1px solid transparent; border-radius: 12px; transition: border-color 150ms, background-color 150ms; }
    .ws-item:hover { background: rgba(139, 92, 246, .07); }
    .ws-item.active { border-color: rgba(139, 92, 246, .5); background: rgba(139, 92, 246, .1); }
    .pill-nav { display: flex; align-items: center; gap: 4px; border: 1px solid rgba(139, 92, 246, .3); border-radius: 999px; background: rgba(139, 92, 246, .08); padding: 4px; }
    .pill-nav button { border-radius: 999px; padding: 6px 16px; font-size: 13px; color: var(--muted); transition: background-color 150ms, color 150ms, box-shadow 150ms; }
    .pill-nav button:hover { color: var(--text); background: rgba(139, 92, 246, .12); }
    .pill-nav button.active { background: linear-gradient(92deg, #8b5cf6, #7c5cfa); color: #fff; box-shadow: 0 4px 14px rgba(124, 92, 250, .35); }
    .ws-card {
      border: 1px solid rgba(139, 92, 246, .28);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(23, 20, 34, .92), rgba(16, 15, 22, .96));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 42px rgba(124, 92, 250, .1);
    }
    .ws-empty {
      border: 1px solid rgba(139, 92, 246, .18);
      border-radius: 14px;
      background: rgba(16, 15, 22, .72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
    }
    @media (max-width: 880px) {
      .app-shell { min-height: 100vh; height: auto; }
      .workspace { display: block; }
      .prompt-pane, .code-pane { width: 100%; border-left: 0; border-right: 0; }
      .prompt-pane { border-bottom: 1px solid var(--border); }
      .preview-pane { width: 100%; height: min(75vh, 680px); min-height: 420px; }
      .code-pane { height: 360px; border-top: 1px solid var(--border); }
      .preview-surface { padding: 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const API_BASE = (location.hostname === "localhost" || location.protocol === "file:")
      ? "http://localhost:3002"
      : window.location.origin;
    const MODEL_NAME = "kimi-k2.6";
    const { useState, useEffect, useRef } = React;

    async function api(path, options = {}) {
      let response;
      try {
        response = await fetch(`${API_BASE}${path}`, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
      } catch {
        throw new Error("网络错误，请确认后端服务运行在 3002 端口");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }

    function relativeTime(value) {
      if (!value) return "";
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
      if (!Number.isFinite(seconds)) return "";
      if (seconds < 60) return "刚刚";
      if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
      if (seconds < 604800) return `${Math.floor(seconds / 86400)} 天前`;
      return new Date(value).toLocaleDateString("zh-CN");
    }

    function fullTime(value) {
      return value ? new Date(value).toLocaleString("zh-CN") : "—";
    }

    function StatusBadge({ status }) {
      const styles = {
        success: "status-success",
        pending: "status-pending",
        failed: "status-failed",
      };
      const labels = { success: "完成", pending: "生成中", failed: "失败" };
      return <span className={`status-badge shrink-0 ${styles[status] || styles.pending}`}>{labels[status] || status}</span>;
    }

    function TrashIcon() {
      return (
        <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      );
    }

    function Landing({ draft, setDraft, onGenerate, isGenerating, busy, onEnterWorkspace }) {
      const locked = isGenerating || busy;
      function submit() {
        if (draft.trim() && !locked) onGenerate(draft);
      }
      const shots = [
        { label: "网站展示", style: { left: "3%", top: "13%", transform: "rotate(-8deg)" }, bg: "linear-gradient(140deg,#1e3a8a 0%,#3b82f6 55%,#bfdbfe 100%)" },
        { label: "电影感网站", style: { right: "4%", top: "11%", transform: "rotate(7deg)" }, bg: "linear-gradient(150deg,#0f172a 30%,#b45309 75%,#f59e0b 100%)" },
        { label: "创意作品集", style: { right: "-1.5%", top: "52%", transform: "rotate(-5deg)" }, bg: "linear-gradient(135deg,#0a0a0a 40%,#3f3f46 100%)" },
        { label: "美食工作室", style: { left: "-1.5%", top: "48%", transform: "rotate(6deg)" }, bg: "linear-gradient(135deg,#b45309 0%,#f59e0b 60%,#fde68a 100%)" },
        { label: "品牌活动页", style: { left: "5%", bottom: "5%", transform: "rotate(-7deg)" }, bg: "linear-gradient(135deg,#450a0a 30%,#7f1d1d 65%,#111 100%)" },
        { label: "新潮商店", style: { right: "5%", bottom: "4%", transform: "rotate(5deg)" }, bg: "linear-gradient(135deg,#facc15 0%,#fb923c 55%,#ef4444 100%)" },
      ];
      return (
        <main className="landing">
          <div className="lt-nav">
            <span className="lt-logo">
              <svg viewBox="0 0 32 32" className="h-6 w-6" aria-hidden="true">
                <rect x="1" y="1" width="30" height="30" rx="8" fill="#7c5cfa" />
                <path d="M10.2 22 15 10h2l4.8 12h-2.1l-1.1-3h-5.2l-1.1 3h-2.1Zm4-4.8h3.7L16 12.2l-1.8 5Z" fill="#fff" />
              </svg>
              <span>Atoms</span>
            </span>
            <nav className="lt-menu" aria-label="站点导航">
              <button type="button">资源 <span className="lt-new">新</span></button>
              <button type="button">社区</button>
              <button type="button">关于</button>
              <button type="button">定价</button>
            </nav>
            <button type="button" className="lt-login" onClick={onEnterWorkspace}>登录开始创作</button>
          </div>
          {shots.map((shot) => (
            <div key={shot.label} className="float-card" style={shot.style} aria-hidden="true">
              <div className="shot" style={{ background: shot.bg }} />
              <div className="tag">{shot.label}</div>
            </div>
          ))}
          <div className="lt-trust">
            <span>深受这些地区创作者信赖</span>
            <strong>
              <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="#111" strokeWidth="1.8" strokeLinejoin="round" aria-hidden="true">
                <path d="M12 3.2a3.4 3.4 0 0 1 3.4 3.4v.3l.3-.2a3.4 3.4 0 1 1 3.4 5.9l-.3.2.3.2a3.4 3.4 0 1 1-3.4 5.9l-.3-.2v.3a3.4 3.4 0 1 1-6.8 0v-.3l-.3.2a3.4 3.4 0 1 1-3.4-5.9l.3-.2-.3-.2a3.4 3.4 0 1 1 3.4-5.9l.3.2v-.3A3.4 3.4 0 0 1 12 3.2Z" />
                <circle cx="12" cy="12" r="2.4" />
              </svg>
              OpenAI
            </strong>
          </div>
          <h1 className="hero-title">把想法变成<br />可销售的产品</h1>
          <form
            className="hero-card"
            onSubmit={(event) => { event.preventDefault(); submit(); }}
          >
            <textarea
              value={draft}
              onChange={(event) => setDraft(event.target.value)}
              onKeyDown={(event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); submit(); } }}
              placeholder={locked ? "上一条任务生成中，请稍候…" : "告知 Atoms 团队你的需求"}
              maxLength={2000}
              disabled={locked}
              className="hero-textarea"
            />
            <div className="hero-foot">
              <span className="hero-hint">{locked ? "任务生成中，完成后可继续" : "Enter 发送"}</span>
              <button type="submit" disabled={locked || !draft.trim()} className="hero-start">
                开始
                <svg viewBox="0 0 24 24" className="h-3.5 w-3.5" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
              </button>
            </div>
          </form>
        </main>
      );
    }

    function PromptPanel({ draft, setDraft, onGenerate, isGenerating, busy, history, onSelect, onDelete, currentId, historyError }) {
      const locked = isGenerating || busy;
      return (
        <aside className="prompt-pane flex flex-col">
          <div className="pane-head flex items-center px-5">
            <span className="ws-label"><span aria-hidden="true">&gt;</span><span>创建应用</span></span>
          </div>
          <form className="border-b border-[rgba(139,92,246,0.14)] p-4" onSubmit={(event) => { event.preventDefault(); onGenerate(draft); }}>
            <label htmlFor="prompt" className="ws-label mb-3"><span aria-hidden="true">&gt;</span><span>需求描述</span></label>
            <textarea
              id="prompt"
              value={draft}
              onChange={(event) => setDraft(event.target.value)}
              placeholder={busy && !isGenerating ? "上一条任务生成中，请稍候…" : "描述你想要的应用，例如：做一个扫雷游戏，支持难度选择和重新开始"}
              className="ws-textarea h-[140px]"
              maxLength={2000}
              disabled={locked}
            />
            <button type="submit" disabled={locked || !draft.trim()} className="generate-btn mt-3 flex h-10 w-full items-center justify-center gap-2 disabled:cursor-not-allowed disabled:opacity-50">
              {(isGenerating || busy) && <span className="spinner !h-4 !w-4 !border-white/35 !border-t-white" />}
              {isGenerating ? "生成中..." : busy ? "生成中，请稍候" : "生成"}
            </button>
          </form>
          <div className="flex min-h-0 flex-1 flex-col">
            <div className="flex items-center justify-between px-5 pb-3 pt-5">
              <h2 className="title-chip text-xs font-semibold uppercase tracking-wider text-[#6b6b6b]">最近生成</h2>
              <span className="text-xs text-[#6b6b6b]">{Math.min(history.length, 5)} / 5</span>
            </div>
            <div className="thin-scroll min-h-0 flex-1 overflow-y-auto px-3 pb-4">
              {historyError && <p className="px-2 py-3 text-xs text-[#ef4444]">{historyError}</p>}
              {!historyError && history.length === 0 && <p className="px-2 py-3 text-sm text-[#a1a1a1]">暂无记录</p>}
              {history.slice(0, 5).map((item) => (
                <div key={item.id} className={`ws-item group mb-1 flex items-stretch ${currentId === item.id ? "active" : ""}`}>
                  <button type="button" onClick={() => onSelect(item.id)} className="min-w-0 flex-1 px-3 py-3 text-left">
                    <span className="block truncate text-sm text-[#ededed]">{item.prompt.slice(0, 40)}</span>
                    <span className="mt-2 flex items-center justify-between gap-2 text-xs text-[#a1a1a1]">
                      <span>{relativeTime(item.created_at)}</span>
                      <StatusBadge status={item.status} />
                    </span>
                  </button>
                  <button type="button" onClick={(event) => { event.stopPropagation(); onDelete(item.id); }} aria-label="删除记录" title="删除记录" className="mr-1 self-center rounded-md p-2 text-[#6b6b6b] opacity-0 transition-colors duration-150 hover:text-[#ef4444] group-hover:opacity-100 focus:opacity-100">
                    <TrashIcon />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </aside>
      );
    }

    function IconButton({ title, disabled, onClick, children }) {
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          title={title}
          aria-label={title}
          className="icon-button inline-flex h-8 w-8 items-center justify-center rounded-md transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent disabled:hover:text-[#a1a1a1]"
        >
          {children}
        </button>
      );
    }

    function PreviewPanel({ generation, isGenerating, onModify, onRetry, displayError }) {
      const [reloadKey, setReloadKey] = useState(0);
      const surfaceRef = useRef(null);
      const ready = generation?.status === "success" && generation.html;
      const pending = isGenerating || generation?.status === "pending";
      const title = generation?.prompt?.trim().slice(0, 20) || "生成的应用";

      return (
        <section className="preview-pane flex min-w-0 flex-col" aria-label="应用预览">
          <div className="pane-head flex items-center justify-between gap-3 px-4">
            <div className="min-w-0">
              <p className="ws-label"><span aria-hidden="true">&gt;</span><span>预览</span></p>
              <h2 className="truncate text-sm font-semibold text-[#f5f4ff]" title={generation?.prompt || title}>{title}</h2>
            </div>
            <div className="flex shrink-0 items-center gap-1">
              <IconButton title="修改需求" onClick={onModify} disabled={!ready}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
              </IconButton>
              <IconButton title="重新加载" onClick={() => setReloadKey((value) => value + 1)} disabled={!ready}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.6 6.1" /><path d="M3 12A9 9 0 0 1 18.6 5.9" /><path d="M3 4v6h6" /><path d="M21 20v-6h-6" /></svg>
              </IconButton>
              <IconButton title="全屏" onClick={() => surfaceRef.current?.requestFullscreen?.()} disabled={!ready}>
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
              </IconButton>
            </div>
          </div>
          <div className="preview-surface" ref={surfaceRef}>
            {ready && !pending ? (
              <iframe key={`${generation.id}-${reloadKey}`} title="生成的应用" sandbox="allow-scripts allow-forms allow-modals allow-popups" srcDoc={generation.html} className="preview-frame w-full h-full bg-white" />
            ) : (
              <div className="ws-empty flex min-h-full w-full items-center justify-center p-6 text-center">
                {pending ? (
                  <div className="flex flex-col items-center gap-4"><span className="spinner" /><p className="text-sm text-[#f5f4ff]">AI 正在生成...</p></div>
                ) : displayError || generation?.status === "failed" ? (
                  <div className="max-w-md">
                    <h3 className="text-sm font-semibold text-[#ef4444]">生成失败</h3>
                    <p className="mt-2 break-words text-sm leading-6 text-[#a1a1a1]">{displayError || generation.error || "未知错误"}</p>
                    {generation?.id && <button type="button" onClick={onRetry} className="mt-5 rounded-lg border border-[rgba(139,92,246,0.3)] px-4 py-2 text-sm text-[#ededed] transition-colors duration-150 hover:bg-[rgba(139,92,246,0.1)]">重试</button>}
                  </div>
                ) : (
                  <div className="max-w-sm">
                    <span className="hero-badge">等待你的灵感</span>
                    <p className="mt-5 text-base font-medium text-[#f5f4ff]">在左侧输入你的需求，点击生成</p>
                    <p className="mt-2 text-[13px] leading-5 text-[#a1a1a1]">生成的网页应用会在这里实时预览</p>
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="flex min-h-9 flex-wrap items-center gap-x-4 gap-y-1 border-t border-[rgba(139,92,246,0.14)] px-4 py-2 text-[11px] text-[#a1a1a1]">
            <span>创建于 {fullTime(generation?.created_at)}</span>
            <span>模型 {generation?.model || MODEL_NAME}</span>
            {generation?.usage && <span>Token {generation.usage.total_tokens ?? ((generation.usage.input_tokens || 0) + (generation.usage.output_tokens || 0))}</span>}
            {generation && <StatusBadge status={pending ? "pending" : generation.status} />}
          </div>
        </section>
      );
    }

    function CodePanel({ generation }) {
      const [copied, setCopied] = useState(false);
      useEffect(() => setCopied(false), [generation?.id, generation?.html]);
      async function copyCode() {
        try {
          await navigator.clipboard.writeText(generation.html);
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch {
          setCopied(false);
        }
      }
      return (
        <aside className="code-pane flex flex-col" aria-label="生成代码">
          <div className="pane-head flex items-center justify-between px-4">
            <div>
              <p className="ws-label"><span aria-hidden="true">&gt;</span><span>代码</span></p>
              <p className="code-font text-[11px] text-[#a1a1a1]">index.html</p>
            </div>
            <button type="button" onClick={copyCode} disabled={!generation?.html} className="inline-flex items-center gap-2 rounded-lg border border-[rgba(139,92,246,0.3)] px-3 py-1.5 text-xs text-[#c4b5fd] transition-colors duration-150 hover:bg-[rgba(139,92,246,0.12)] hover:text-[#f5f4ff] disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent">
              <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg>
              {copied ? "已复制" : "复制"}
            </button>
          </div>
          <div className="code-scroll thin-scroll bg-transparent">
            {generation?.html ? <pre className="code-font p-4 text-xs leading-5 text-[#a1a1a1]"><code>{generation.html}</code></pre> : <div className="flex h-full min-h-[220px] items-center justify-center p-6 text-center text-sm text-[#a1a1a1]">生成的 HTML 代码会显示在这里</div>}
          </div>
          <div className="border-t border-[rgba(139,92,246,0.14)] px-4 py-2 text-[11px] text-[#a1a1a1]">{generation?.html ? `${generation.html.length.toLocaleString()} 字符` : "HTML"}</div>
        </aside>
      );
    }

    function History({ history, onSelect, onDelete, error, onRefresh }) {
      return (
        <main className="thin-scroll min-h-0 flex-1 overflow-y-auto">
          <div className="mx-auto max-w-5xl px-6 py-8">
            <div className="mb-6 flex items-center justify-between gap-3">
              <div>
                <span className="hero-badge">生成历史</span>
                <h1 className="mt-4 text-xl font-semibold text-[#f5f4ff]">历史记录</h1>
                <p className="mt-1 text-xs text-[#a1a1a1]">{history.length} 条记录</p>
              </div>
              <button type="button" onClick={onRefresh} className="rounded-lg border border-[rgba(139,92,246,0.3)] px-3 py-2 text-xs text-[#c4b5fd] transition-colors duration-150 hover:bg-[rgba(139,92,246,0.12)] hover:text-[#f5f4ff]">刷新</button>
            </div>
            {error && <p className="mb-4 text-sm text-[#ef4444]">{error}</p>}
            {!error && history.length === 0 && <p className="ws-card px-6 py-10 text-center text-sm text-[#a1a1a1]">暂无生成记录</p>}
            <div className="ws-card overflow-hidden">
              {history.map((item) => (
                <div key={item.id} className="group flex items-start gap-3 border-b border-[rgba(139,92,246,0.12)] transition-colors duration-150 last:border-b-0 hover:bg-[rgba(139,92,246,0.07)]">
                  <button type="button" onClick={() => onSelect(item.id)} className="flex min-w-0 flex-1 flex-wrap items-start justify-between gap-4 px-4 py-5 text-left transition-colors duration-150">
                    <span className="min-w-0 flex-1 whitespace-pre-wrap break-words text-sm leading-6 text-[#ededed]">{item.prompt}</span>
                    <span className="flex shrink-0 items-center gap-4"><time className="text-xs text-[#a1a1a1]">{fullTime(item.created_at)}</time><StatusBadge status={item.status} /></span>
                  </button>
                  <button type="button" onClick={(event) => { event.stopPropagation(); onDelete(item.id); }} aria-label="删除记录" title="删除记录" className="mr-3 mt-4 rounded-md p-2 text-[#6b6b6b] opacity-0 transition-colors duration-150 hover:text-[#ef4444] group-hover:opacity-100 focus:opacity-100">
                    <TrashIcon />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </main>
      );
    }

    function ModifyDialog({ onClose, onSubmit, isGenerating }) {
      const [text, setText] = useState("");
      useEffect(() => {
        const onKeyDown = (event) => { if (event.key === "Escape" && !isGenerating) onClose(); };
        document.addEventListener("keydown", onKeyDown);
        return () => document.removeEventListener("keydown", onKeyDown);
      }, [onClose, isGenerating]);
      return (
        <div className="fixed inset-0 z-30 flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm" onMouseDown={(event) => { if (event.target === event.currentTarget && !isGenerating) onClose(); }}>
          <form role="dialog" aria-modal="true" aria-labelledby="modify-title" onSubmit={(event) => { event.preventDefault(); if (text.trim()) onSubmit(text.trim()); }} className="ws-card w-full max-w-lg p-5">
            <div className="flex items-center justify-between gap-3">
              <h2 id="modify-title" className="ws-label"><span aria-hidden="true">&gt;</span><span>修改需求</span></h2>
              <button type="button" onClick={onClose} disabled={isGenerating} aria-label="关闭" className="inline-flex h-8 w-8 items-center justify-center rounded-md text-[#a1a1a1] transition-colors duration-150 hover:bg-[rgba(139,92,246,0.12)] hover:text-[#ededed]">
                <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
              </button>
            </div>
            <textarea autoFocus value={text} onChange={(event) => setText(event.target.value)} maxLength={2000} placeholder="例如：把扫雷的格子调大一点" className="ws-textarea mt-4 h-[140px]" />
            <div className="mt-4 flex justify-end gap-2">
              <button type="button" onClick={onClose} disabled={isGenerating} className="rounded-lg px-4 py-2 text-sm text-[#a1a1a1] transition-colors duration-150 hover:bg-[rgba(139,92,246,0.12)] hover:text-[#ededed]">取消</button>
              <button type="submit" disabled={!text.trim() || isGenerating} className="generate-btn">生成新版本</button>
            </div>
          </form>
        </div>
      );
    }

    function App() {
      const [currentView, setCurrentView] = useState("landing");
      const [currentGeneration, setCurrentGeneration] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [history, setHistory] = useState([]);
      const [historyError, setHistoryError] = useState("");
      const [displayError, setDisplayError] = useState("");
      const [draft, setDraft] = useState("");
      const [modifyOpen, setModifyOpen] = useState(false);
      const [toast, setToast] = useState("");
      const operationRef = useRef(0);

      async function refreshHistory() {
        try {
          const records = await api("/api/generations");
          setHistory(records);
          setHistoryError("");
        } catch (error) {
          setHistoryError(error.message);
        }
      }

      useEffect(() => { refreshHistory(); }, []);
      useEffect(() => { if (currentView === "history") refreshHistory(); }, [currentView]);
      useEffect(() => () => { operationRef.current += 1; }, []);
      // 有任务生成中时，每 5 秒刷新历史，让 pending 状态自动流转
      const hasPendingRecord = history.some((record) => record.status === "pending");
      useEffect(() => {
        if (!hasPendingRecord) return undefined;
        const timer = setInterval(refreshHistory, 5000);
        return () => clearInterval(timer);
      }, [hasPendingRecord]);

      async function pollGeneration(id, operation) {
        for (let attempt = 0; attempt < 30; attempt += 1) {
          if (operationRef.current !== operation) return;
          try {
            const record = await api(`/api/generations/${encodeURIComponent(id)}`);
            if (operationRef.current !== operation) return;
            setCurrentGeneration(record);
            if (record.status !== "pending") {
              setIsGenerating(false);
              refreshHistory();
              return;
            }
          } catch (error) {
            if (operationRef.current !== operation) return;
            setDisplayError(error.message);
            setIsGenerating(false);
            return;
          }
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        if (operationRef.current === operation) {
          setDisplayError("生成超时");
          setIsGenerating(false);
          refreshHistory();
        }
      }

      async function submitGeneration(prompt, parentId = null) {
        if (!prompt?.trim() || isGenerating) return;
        // 并发守卫：已有任务生成中（含刷新页面后仍未完成的）时拒绝新请求，避免 429
        if (history.some((record) => record.status === "pending")) {
          setCurrentView("workspace");
          showToast("上一条任务还在生成中，请等它完成后再试");
          return;
        }
        const operation = ++operationRef.current;
        setIsGenerating(true);
        setDisplayError("");
        setCurrentView("workspace");
        setModifyOpen(false);
        try {
          const data = await api("/api/generations", {
            method: "POST",
            body: JSON.stringify({ prompt: prompt.trim(), ...(parentId ? { parentId } : {}) }),
          });
          if (operationRef.current !== operation) return;
          setCurrentGeneration({ id: data.id, prompt: prompt.trim(), html: null, status: "pending", error: null, created_at: new Date().toISOString(), parent_id: parentId });
          refreshHistory();
          pollGeneration(data.id, operation);
        } catch (error) {
          if (operationRef.current !== operation) return;
          setDisplayError(error.message);
          setIsGenerating(false);
        }
      }

      async function selectGeneration(id) {
        const operation = ++operationRef.current;
        setCurrentView("workspace");
        setDisplayError("");
        setIsGenerating(false);
        try {
          const record = await api(`/api/generations/${encodeURIComponent(id)}`);
          if (operationRef.current !== operation) return;
          setCurrentGeneration(record);
          if (record.status === "pending") {
            setIsGenerating(true);
            pollGeneration(id, operation);
          }
        } catch (error) {
          if (operationRef.current === operation) {
            setCurrentGeneration(null);
            setDisplayError(error.message);
          }
        }
      }

      async function retryGeneration() {
        if (!currentGeneration?.id || isGenerating) return;
        const id = currentGeneration.id;
        const operation = ++operationRef.current;
        setDisplayError("");
        setIsGenerating(true);
        try {
          await api(`/api/generations/${encodeURIComponent(id)}/retry`, { method: "POST" });
          if (operationRef.current !== operation) return;
          setCurrentGeneration((record) => ({ ...record, html: null, status: "pending", error: null }));
          refreshHistory();
          pollGeneration(id, operation);
        } catch (error) {
          if (operationRef.current !== operation) return;
          setDisplayError(error.message);
          setIsGenerating(false);
        }
      }

      function showToast(message) {
        setToast(message);
        setTimeout(() => setToast(""), 2600);
      }

      async function deleteRecord(id) {
        if (!id || !window.confirm("确定删除这条记录？")) return;
        try {
          await api(`/api/generations/${encodeURIComponent(id)}`, { method: "DELETE" });
          setHistory((records) => records.filter((record) => record.id !== id));
          if (currentGeneration?.id === id) {
            operationRef.current += 1;
            setCurrentGeneration(null);
            setIsGenerating(false);
            setDisplayError("");
          }
        } catch (error) {
          showToast(error.message);
        }
      }

      return (
        <div className="app-shell">
          {currentView !== "landing" && (
          <header className="flex h-14 shrink-0 items-center justify-between border-b border-[#262626] bg-[#0a0a0a] px-4 sm:px-6">
            <div className="flex items-center gap-3">
              <svg viewBox="0 0 32 32" className="h-8 w-8 shrink-0" aria-hidden="true">
                <rect x="1" y="1" width="30" height="30" rx="8" fill="#7c5cfa" />
                <path d="M10.2 22 15 10h2l4.8 12h-2.1l-1.1-3h-5.2l-1.1 3h-2.1Zm4-4.8h3.7L16 12.2l-1.8 5Z" fill="#ffffff" />
              </svg>
              <div className="text-sm font-bold leading-4 text-[#f5f4ff]">Atoms Demo</div>
            </div>
            <nav className="pill-nav" aria-label="主导航">
              <button type="button" onClick={() => setCurrentView("workspace")} className={currentView === "workspace" ? "active" : ""}>Workspace</button>
              <button type="button" onClick={() => setCurrentView("history")} className={currentView === "history" ? "active" : ""}>History</button>
            </nav>
          </header>
          )}
          {currentView === "landing" ? (
            <Landing draft={draft} setDraft={setDraft} onGenerate={submitGeneration} isGenerating={isGenerating} busy={hasPendingRecord} onEnterWorkspace={() => setCurrentView("workspace")} />
          ) : currentView === "workspace" ? (
            <main className="workspace flex h-[calc(100vh-56px)] text-[#ededed]">
              <PromptPanel draft={draft} setDraft={setDraft} onGenerate={submitGeneration} isGenerating={isGenerating} busy={hasPendingRecord} history={history} onSelect={selectGeneration} onDelete={deleteRecord} currentId={currentGeneration?.id} historyError={historyError} />
              <PreviewPanel generation={currentGeneration} isGenerating={isGenerating} onModify={() => setModifyOpen(true)} onRetry={retryGeneration} displayError={displayError} />
              <CodePanel generation={currentGeneration} />
            </main>
          ) : <History history={history} onSelect={selectGeneration} onDelete={deleteRecord} error={historyError} onRefresh={refreshHistory} />}
          {modifyOpen && <ModifyDialog onClose={() => setModifyOpen(false)} onSubmit={(text) => submitGeneration(text, currentGeneration.id)} isGenerating={isGenerating} />}
          {toast && <div className="fixed bottom-4 right-4 z-40 max-w-sm rounded-md border border-[#ef4444]/40 bg-[#141414] px-4 py-3 text-sm text-[#ef4444] shadow-2xl">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
